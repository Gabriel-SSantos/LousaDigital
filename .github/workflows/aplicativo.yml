# Gera os instaladores do aplicativo Quadro no Ar (Windows .exe, Linux .AppImage e .deb) e publica numa versão do GitHub.
# O botão "Baixar o app" do quadro aponta para releases/latest/download/<arquivo>, então a versão mais nova é sempre a baixada.
#
# Para publicar uma versão nova:   git tag v1.0.0 && git push origin v1.0.0
# (Rodar à mão em Actions → Aplicativo → Run workflow só gera os instaladores, sem publicar.)
name: Aplicativo

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instaladores:
    strategy:
      matrix:
        include:
          - os: windows-latest
            alvo: win
          - os: ubuntu-latest
            alvo: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: aplicativo
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versão do aplicativo = versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run dist:${{ matrix.alvo }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false     # sem certificado de assinatura de código
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.alvo }}
          path: |
            aplicativo/dist/*.exe
            aplicativo/dist/*.AppImage
            aplicativo/dist/*.deb
          if-no-files-found: error

  publicar:
    needs: instaladores
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          make_latest: true
          body: |
            Aplicativo Quadro no Ar: o quadro com o servidor da rede embutido. Instale, abra e clique em Transmitir:
            os aparelhos no mesmo Wi-Fi assistem pelo QR Code, mesmo sem internet.

            - **Windows:** Quadro-no-Ar-Setup.exe
            - **Linux (qualquer distribuição):** Quadro-no-Ar.AppImage
            - **Ubuntu, Debian, Mint:** Quadro-no-Ar.deb
